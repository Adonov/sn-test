name: Mobile apps

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: taisty-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: taisty-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
      # Smoke test: start the app in a simulator, check it stays up and its main thread isn't stuck.
      - name: Launch in the simulator
        timeout-minutes: 10
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty "$UDID" com.taisty.app > launch.log 2>&1 &
          sleep 45
          PID=$(pgrep -f "App.app/App" | head -1 || true)
          echo "App process: ${PID:-not running}"
          if [ -n "$PID" ]; then
            sample "$PID" 3 -file sample.txt > /dev/null 2>&1 || true
            echo "---- main thread"
            sed -n '/Thread_[0-9]*.*DispatchQueue_1/,/^ *[0-9]* Thread_/p' sample.txt | head -80 || true
          fi
          echo "---- app output"
          head -300 launch.log
          xcrun simctl io "$UDID" screenshot simulator.png || true
          test -n "$PID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taisty-ios-smoke-test
          path: |
            simulator.png
            sample.txt
            launch.log
          if-no-files-found: ignore
